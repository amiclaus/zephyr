description: |
  Common properties for Analog Devices dual SPDT analog switches in the
  ADG[1]736 family driven by 2 dedicated GPIO control pins.

properties:
  in1-gpios:
    type: phandle-array
    required: true
    description: GPIO controlling switch SW1 path (0 = B, 1 = A).

  in2-gpios:
    type: phandle-array
    required: true
    description: GPIO controlling switch SW2 path (0 = B, 1 = A).
